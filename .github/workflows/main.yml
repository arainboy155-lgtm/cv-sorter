name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: CVSorter

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "CV Sorter" --collect-all tkinterdnd2 --collect-all pdfplumber cv_sorter_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CV-Sorter-Windows
          path: CVSorter/dist/CV Sorter.exe
